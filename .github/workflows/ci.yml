name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Deny all permissions by default — grant minimum per job
permissions: {}

jobs:
  build:
    name: build (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Zero-trust install: block ALL postinstall/preinstall lifecycle scripts.
      # Prevents compromised transitive dependencies from executing arbitrary code.
      - name: Install dependencies (zero-trust)
        run: npm ci --ignore-scripts

      # Explicit whitelist: only named, reviewed native modules may compile.
      # keytar: OS keychain bindings — source-available, required for API key storage.
      - name: Rebuild trusted native modules
        run: npm rebuild keytar 2>/dev/null || true
        env:
          npm_config_ignore_scripts: 'false'

      # Fail on HIGH or CRITICAL vulnerabilities. Moderate/low → weekly audit workflow.
      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
