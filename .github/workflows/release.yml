name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create GitHub Release
      id-token: write   # OIDC — enables npm --provenance attestation
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Zero-trust install — no postinstall scripts from any package.
      - name: Install dependencies (zero-trust)
        run: npm ci --ignore-scripts

      - name: Rebuild trusted native modules
        run: npm rebuild keytar 2>/dev/null || true
        env:
          npm_config_ignore_scripts: 'false'

      # Release gate: no HIGH/CRITICAL vulnerabilities allowed to ship.
      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          generate_release_notes: true

      # --provenance: generates a signed SLSA attestation linking this package
      # to the specific GitHub Actions run that built it. Verifiable via:
      #   npm audit signatures recmp3-cli@<version>
      # --ignore-scripts: prevents prepublishOnly from running (build already done above).
      - name: Publish to npm
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
